<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Web Q&A</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }
        
        header p {
            opacity: 0.9;
        }
        
        .content {
            padding: 30px;
        }
        
        .section {
            margin-bottom: 30px;
        }
        
        .section h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.3em;
        }
        
        .upload-area {
            border: 2px dashed #667eea;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            background: #f8f9ff;
            transition: all 0.3s;
        }
        
        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }
        
        .upload-area input[type="file"] {
            display: none;
        }
        
        .upload-area label {
            cursor: pointer;
            color: #667eea;
            font-weight: 600;
        }
        
        .upload-area button {
            margin-top: 15px;
            padding: 10px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .upload-area button:hover {
            transform: scale(1.05);
        }
        
        .upload-area button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .query-area {
            display: flex;
            gap: 10px;
        }
        
        .query-area input {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        
        .query-area input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .query-area button {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .query-area button:hover {
            transform: scale(1.05);
        }
        
        .query-area button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .response-area {
            background: #f8f9ff;
            border-radius: 8px;
            padding: 20px;
            min-height: 100px;
            border-left: 4px solid #667eea;
        }
        
        .response-area h3 {
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .response-area p {
            color: #333;
            line-height: 1.6;
        }
        
        .status {
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 0.9em;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .file-info {
            margin-top: 15px;
            font-size: 0.9em;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔍 RAG Web Q&A</h1>
            <p>Upload documents and ask questions powered by Retrieval-Augmented Generation</p>
        </header>
        
        <div class="content">
            <div class="section">
                <h2>📁 Upload Documents</h2>
                <div class="upload-area">
                    <input type="file" id="file" accept=".pdf,.csv,.txt,.md">
                    <label for="file">Choose a file (PDF, CSV, TXT, MD)</label>
                    <div class="file-info" id="fileInfo"></div>
                    <button onclick="upload()" id="uploadBtn">Upload & Index</button>
                    <div id="uploadStatus"></div>
                </div>
            </div>
            
            <div class="section">
                <h2>💬 Ask a Question</h2>
                <div class="query-area">
                    <input type="text" id="query" placeholder="Ask anything about your documents..." 
                           onkeypress="if(event.key === 'Enter') ask()">
                    <button onclick="ask()" id="askBtn">Ask</button>
                </div>
                <div class="response-area">
                    <h3>Answer:</h3>
                    <p id="response">Your answer will appear here...</p>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const fileInput = document.getElementById('file');
        const fileInfo = document.getElementById('fileInfo');
        const uploadStatus = document.getElementById('uploadStatus');
        const responseEl = document.getElementById('response');
        const uploadBtn = document.getElementById('uploadBtn');
        const askBtn = document.getElementById('askBtn');
        
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                fileInfo.textContent = `Selected: ${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
            }
        });
        
        async function upload() {
            const file = fileInput.files[0];
            if (!file) {
                showStatus(uploadStatus, 'Please select a file first', 'error');
                return;
            }
            
            uploadBtn.disabled = true;
            uploadBtn.textContent = 'Uploading...';
            
            try {
                const formData = new FormData();
                formData.append('file', file);
                
                const res = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    showStatus(uploadStatus, 
                        `✅ ${data.message} (Doc ID: ${data.doc_id})`, 
                        'success');
                } else {
                    showStatus(uploadStatus, `❌ Error: ${data.error}`, 'error');
                }
            } catch (err) {
                showStatus(uploadStatus, `❌ Error: ${err.message}`, 'error');
            } finally {
                uploadBtn.disabled = false;
                uploadBtn.textContent = 'Upload & Index';
            }
        }
        
        async function ask() {
            const query = document.getElementById('query').value.trim();
            if (!query) {
                showStatus(responseEl, 'Please enter a question', 'error');
                return;
            }
            
            askBtn.disabled = true;
            askBtn.textContent = 'Thinking...';
            responseEl.innerHTML = '<span class="loading"></span>Searching and generating answer...';
            
            try {
                const res = await fetch('/ask_stream', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({query})
                });
                
                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let result = '';
                
                while (true) {
                    const {done, value} = await reader.read();
                    if (done) break;
                    
                    result += decoder.decode(value);
                    responseEl.textContent = result;
                }
            } catch (err) {
                responseEl.textContent = `Error: ${err.message}`;
            } finally {
                askBtn.disabled = false;
                askBtn.textContent = 'Ask';
            }
        }
        
        function showStatus(element, message, type) {
            element.className = `status ${type}`;
            element.textContent = message;
        }
    </script>
</body>
</html>
